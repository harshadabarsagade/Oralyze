<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // GitHub Pages 404 handler: redirect any direct route to static/
    var path = window.location.pathname;
    var base = '/Oralyze/';
    var rel = path.startsWith(base) ? path.slice(base.length) : path;
    if (!rel.startsWith('static/')) {
      window.location.replace('/Oralyze/static/' + window.location.search + window.location.hash);
    } else {
      window.location.replace('/Oralyze/static/');
    }
  </script>
  <meta http-equiv="refresh" content="0; url=/Oralyze/static/">
  <title>Oralyze</title>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; background: #0b0f19; color: #f1f5f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <p style="font-size: 1.1rem; font-weight: 500;">Redirecting to Oralyze...</p>
    <p style="font-size: 0.85rem; color: #94a3b8;"><a href="/Oralyze/static/" style="color: #60a5fa; text-decoration: underline;">Click here if not redirected</a>.</p>
  </div>
</body>
</html>
